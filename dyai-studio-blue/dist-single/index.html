nt","what the human decides","what AI contributes","which tools are required","what can be deterministic","how failure behaves","how quality is checked","whether anything improved"],thesisA:"AI capability alone is not augmentation.",thesisB:"The designed relationship is.",scrollHint:"Keep scrolling — each question is a relationship still missing."},map:{title:"Start with the work. Build the system around it.",body:"Choose a situation and inspect how a different problem creates a different human–AI system.",illustrative:"ILLUSTRATIVE SITUATIONS — NOT MEASURED CUSTOMER CASES",select:"CHOOSE A SITUATION",scenarios:{decision:{title:"Prepare a complex decision",note:"Bring scattered evidence into view without delegating the decision.",thesis:"The human owns the decision. AI synthesises and challenges — it does not decide."},knowledge:{title:"Make organisational knowledge usable",note:"Connect trusted knowledge to the moment someone needs to act.",thesis:"The key risk is an unsupported answer. Retrieval, review and evidence carry the system."},coordination:{title:"Reduce coordination friction",note:"Make hand-offs clearer while keeping people responsible for the work.",thesis:"Tools, workflow rules and human confirmation do the work. An LLM is optional here."},content:{title:"Create repeatable high-quality content",note:"Turn good editorial judgement into a repeatable production practice.",thesis:"Editorial judgement sets the standard; AI transforms within it; review is a fixed step."}},legend:{primary:"primary layer",secondary:"secondary layer",optional:"optional layer",primaryRoute:"primary route",secondaryRoute:"supporting relationship"},prominence:{primary:"PRIMARY",secondary:"SECONDARY",optional:"OPTIONAL"},canvasMeta:"ONE PROBLEM · ONE SYSTEM",aiFlag:{central:"LLM · IN THE LOOP",optional:"LLM · OPTIONAL"},inspect:"Select any layer to inspect its role in this system.",reconfigured:"System reconfigured for:",inspector:{selected:"SELECTED LAYER",question:"QUESTION",role:"ROLE IN THIS SCENARIO",human:"HUMAN RESPONSIBILITY",ai:"AI / SYSTEM CONTRIBUTION",control:"CONTROL BOUNDARY",evidence:"EVIDENCE CHECK",none:"Choose a layer on the map."},layers:{human:{title:"Human",question:"What requires judgement?"},context:{title:"Context",question:"What must the system know?"},ai:{title:"AI",question:"Where can intelligence help?"},tools:{title:"Tools",question:"What needs to connect?"},workflow:{title:"Workflow",question:"How does work move?"},control:{title:"Human control",question:"Where does a person decide?"},evidence:{title:"Evidence",question:"How will we know?"},value:{title:"Value",question:"What changed in the work?"}},roles:{decision:{human:{role:"Owns the decision and the question behind it.",human:"Frames what is being decided, by whom and against which criteria.",control:"The decision is never delegated."},context:{role:"Makes the decision situation specific.",human:"Names constraints, stakeholders and what counts as a good outcome.",evidence:"Is the relevant material actually in view?"},ai:{role:"Synthesises the evidence and challenges the preferred option.",ai:"Summarises, compares, surfaces counter-arguments and gaps.",human:"Decides which challenges matter.",control:"No recommendation is executed autonomously."},tools:{role:"Secondary: brings scattered documents and data into one view."},workflow:{role:"Light: a preparation rhythm before the decision meeting."},control:{role:"An explicit stop point: the human reads, weighs and decides.",human:"Signs off on what enters the decision record.",control:"AI output is advisory only."},evidence:{role:"Checks whether the decision was better prepared — not whether it was 'right'.",evidence:"Were alternatives, risks and assumptions visible before deciding?"},value:{role:"A decision made with the relevant evidence in view and ownership intact."}},knowledge:{human:{role:"Asks in the moment of work and judges the answer.",human:"Decides whether an answer is good enough to act on."},context:{role:"Primary: the trusted, permissioned knowledge and its boundaries.",human:"Curates which sources count as trusted.",evidence:"Is the source current and permitted?"},ai:{role:"Synthesises an answer grounded in retrieved sources.",ai:"Retrieval-grounded synthesis with visible sources.",control:"Answers without a source are flagged, never hidden."},tools:{role:"Primary: retrieval and source connections — documents, wikis, systems."},workflow:{role:"Secondary: where the question arises inside daily work."},control:{role:"Human review for consequential answers. Unsupported answers are the key risk.",control:"Unsupported answers are visibly marked."},evidence:{role:"Traces each answer to its sources and checks real adoption.",evidence:"Were answers supported — and were they actually used?"},value:{role:"Knowledge reaches the person who needs it, with its provenance visible."}},coordination:{human:{role:"Confirms hand-offs and handles exceptions.",human:"Stays responsible for the work that moves between people."},context:{role:"Secondary: the rules of who hands what to whom, and when."},ai:{role:"Optional. Possibly useful for summarising long threads — not the centre of this system.",ai:"Optional summarisation only.",control:"Nothing is sent or changed by a model."},tools:{role:"Primary: the existing tools where the work already lives, connected through APIs."},workflow:{role:"Primary: explicit sequence, hand-offs, states and exceptions.",human:"Agrees the sequence and owns the exceptions."},control:{role:"Human confirmation before anything leaves the team.",control:"Deterministic rules do the routing; a person confirms."},evidence:{role:"Measures whether hand-offs became clearer and faster.",evidence:"Fewer open loops? Shorter waiting times? Fewer re-asks?"},value:{role:"Less friction, with responsibility kept where it belongs — possibly without any LLM."}},content:{human:{role:"Owns editorial judgement: what is worth saying, and to whom.",human:"Sets the standard and decides what is published."},context:{role:"Primary: voice, audience, examples of good and bad, boundaries."},ai:{role:"Transforms: drafts, adapts formats, restructures — inside the editorial frame.",ai:"Drafting, transformation, variation.",control:"No publication without review."},tools:{role:"Secondary: the publishing and asset tools already in use."},workflow:{role:"Primary: a repeatable production rhythm from brief to review to publication."},control:{role:"Editorial review as a fixed step, not an afterthought.",control:"Review before publication is mandatory."},evidence:{role:"Evaluates quality against the editorial standard — not against volume.",evidence:"Did quality hold while repetition increased?"},value:{role:"Good judgement becomes a repeatable production practice."}}},mobileHint:"Sequential inspection — the same system, read top to bottom."},audiences:{title:"Same principle. Different working systems.",intro:"Select a path to see how the same augmentation principles meet a different context, responsibility and system scale.",selectHint:"Select a path",selected:"SELECTED PATH",other:"The other path stays in view — same principle.",fields:{problem:"THE PROBLEM",change:"WHAT SHOULD CHANGE",system:"THE WORKING SYSTEM",entry:"ENTRY ROUTE"},paths:{org:{label:"ORGANISATIONS",title:"Build an AI practice, not a collection of pilots.",body:"AI access spreads faster than shared practice. Teams test disconnected tools while work design, context, responsibility and evidence remain unresolved.",problem:"Experiments everywhere, practice nowhere. Nobody owns the question of what should actually change in the work.",change:"One real workflow redesigned around human decisions, relevant context and useful AI — with evidence of what improved.",system:"Shared context, explicit responsibilities, governed controls and an evidence record that a team can inspect and improve.",entry:"A capability-gap mapping with the people who do the work. Then one workflow, built small."
